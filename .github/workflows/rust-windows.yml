name: Rust Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustc -Vv; cargo -V

      - name: Run Windows test suite
        run: cargo test --workspace --locked

      - name: Build Windows release
        run: cargo build --release --locked

      - name: Prepare Celeste executable
        shell: pwsh
        run: Copy-Item target/release/scarlet.exe celeste-testing.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: celeste-windows-x64
          path: rust/celeste-testing.exe
          if-no-files-found: error
          retention-days: 14
