name: Rust Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustc -Vv; cargo -V

      # GitHub-hosted runners start with an empty disk. Preserve both the
      # downloaded crates and Cargo's compiled dependency graph between
      # runs. runner.os keeps Windows objects separate from a future Linux
      # workflow; Cargo.lock changes invalidate the dependency cache.
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Run Windows test suite
        run: cargo test --workspace --locked

      - name: Build Windows release
        run: cargo build --release --locked

      - name: Prepare Celeste executable
        shell: pwsh
        run: Copy-Item target/release/celeste.exe celeste-testing.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: celeste-windows-x64
          path: rust/celeste-testing.exe
          if-no-files-found: error
          retention-days: 14
