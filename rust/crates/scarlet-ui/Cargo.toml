[package]
name = "scarlet-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of net.sybyline.scarlet.ui (Swing/FlatLaf -> egui/eframe)"

[dependencies]
scarlet-core.workspace = true
scarlet-discord.workspace = true
songbird.workspace = true
scarlet-vrchat.workspace = true
scarlet-events.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
tokio.workspace = true
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
open = "5"
# Native file/message dialogs: the data-folder question has to be asked
# before the egui event loop exists, and the import buttons need a real
# file picker.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
