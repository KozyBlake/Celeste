[package]
name = "celeste-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of net.sybyline.scarlet.ui (Swing/FlatLaf -> egui/eframe)"

[dependencies]
celeste-core.workspace = true
celeste-discord.workspace = true
songbird.workspace = true
celeste-vrchat.workspace = true
celeste-events.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui_extras = "0.29"
image.workspace = true
open = "5"
# Native file/message dialogs: the data-folder question has to be asked
# before the egui event loop exists, and the import buttons need a real
# file picker.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# eframe intentionally depends on wgpu with its default features disabled.
# Enable DX12 explicitly for Windows so selecting `Backends::DX12` does not
# produce an empty backend set at runtime. This only unifies features into
# eframe's existing wgpu dependency; Celeste uses wgpu through eframe.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "22.1", features = ["dx12"], default-features = false }

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
