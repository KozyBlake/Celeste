[workspace]
resolver = "2"
members = [
    "crates/celeste",
    "crates/celeste-core",
    "crates/celeste-gif",
    "crates/celeste-discord",
    "crates/celeste-vrchat",
    "crates/celeste-dave",
    "crates/celeste-ui",
    "crates/celeste-events",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KozyBlake/ScarletRust"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest_cookie_store = "0.8"
unicode-script = "0.5"
unicode-normalization = "0.1"
unicode-general-category = "1"
deunicode = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "native_tls_backend",
    "model",
    "cache",
] }
songbird = { version = "0.6", default-features = false, features = ["builtin-queue", "driver", "gateway", "serenity", "tungstenite", "native"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
lru = "0.16"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
regex = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip = { version = "8.2", default-features = false, features = ["deflate-flate2", "bzip2", "lzma", "xz", "zstd"] }
sevenz-rust = { version = "0.6.1", default-features = false, features = ["bzip2", "zstd"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }

celeste-core = { path = "crates/celeste-core" }
celeste-gif = { path = "crates/celeste-gif" }
celeste-discord = { path = "crates/celeste-discord" }
celeste-vrchat = { path = "crates/celeste-vrchat" }
celeste-dave = { path = "crates/celeste-dave" }
celeste-ui = { path = "crates/celeste-ui" }
celeste-events = { path = "crates/celeste-events" }
